    <!-- Standalone self-contained audio engine with lush mountain reverb & valley echo -->
    <script>
      (function() {
        var ctx = null;
        var masterBus = null;
        var hornActive = false;
        var hornStart = 0;
        var hornNodes = null;
        var hornGain = null;
        var bellStrikeCount = 0;

        function getAudioCtx() {
          if (!ctx) {
            var Ctx = window.AudioContext || window.webkitAudioContext;
            ctx = new Ctx({ latencyHint: 'interactive' });
            initMasterBus(ctx);
          }
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          return ctx;
        }

        // Generates an acoustic impulse response for mountain valley reverb with smooth fade-in and decay
        function createReverbImpulse(c, duration, decay) {
          var rate = c.sampleRate;
          var length = Math.floor(rate * duration);
          var impulse = c.createBuffer(2, length, rate);
          var left = impulse.getChannelData(0);
          var right = impulse.getChannelData(1);
          var attackLen = Math.floor(rate * 0.012); // 12ms smooth attack window prevents transient click
          for (var i = 0; i < length; i++) {
            var t = i / rate;
            var env = Math.exp(-t * decay);
            var fadeIn = i < attackLen ? (i / attackLen) : 1.0;
            left[i] = (Math.random() * 2 - 1) * env * fadeIn * 0.32;
            right[i] = (Math.random() * 2 - 1) * env * fadeIn * 0.32;
          }
          return impulse;
        }

        // Master spatial audio bus with brickwall limiter, dry, toned-down valley reverb, and filtered slapback echo
        function initMasterBus(c) {
          if (masterBus) return;

          // Master Dynamics Compressor / Limiter to completely prevent clipping pops and overload glitches
          var limiter = c.createDynamicsCompressor();
          limiter.threshold.setValueAtTime(-2.0, c.currentTime);
          limiter.knee.setValueAtTime(3.0, c.currentTime);
          limiter.ratio.setValueAtTime(20.0, c.currentTime);
          limiter.attack.setValueAtTime(0.001, c.currentTime);
          limiter.release.setValueAtTime(0.05, c.currentTime);
          limiter.connect(c.destination);

          masterBus = c.createGain();
          masterBus.gain.setValueAtTime(0.85, c.currentTime);

          // 1. Dry path (crisp, present, and clear)
          var dryGain = c.createGain();
          dryGain.gain.setValueAtTime(0.74, c.currentTime);
          masterBus.connect(dryGain);
          dryGain.connect(limiter);

          // 2. Valley Reverb path (toned down slightly for subtle mountain depth)
          try {
            var revBuf = createReverbImpulse(c, 1.8, 3.0);
            var convolver = c.createConvolver();
            convolver.buffer = revBuf;
            var revGain = c.createGain();
            revGain.gain.setValueAtTime(0.12, c.currentTime);
            masterBus.connect(convolver);
            convolver.connect(revGain);
            revGain.connect(limiter);
          } catch(e){}

          // 3. Valley Slapback Echo path (toned down, gentle natural reflection)
          try {
            var echoDelay = c.createDelay();
            echoDelay.delayTime.setValueAtTime(0.22, c.currentTime); // 220ms echo

            var echoFeedback = c.createGain();
            echoFeedback.gain.setValueAtTime(0.18, c.currentTime);

            var echoFilter = c.createBiquadFilter();
            echoFilter.type = 'bandpass';
            echoFilter.frequency.setValueAtTime(1100, c.currentTime); // warm mountain reflection
            echoFilter.Q.setValueAtTime(0.9, c.currentTime);

            var echoGain = c.createGain();
            echoGain.gain.setValueAtTime(0.10, c.currentTime);

            masterBus.connect(echoDelay);
            echoDelay.connect(echoFilter);
            echoFilter.connect(echoFeedback);
            echoFeedback.connect(echoDelay);
            echoDelay.connect(echoGain);
            echoGain.connect(limiter);
          } catch(e){}
        }

        function createNoise(duration) {
          var c = getAudioCtx();
          var len = Math.floor(c.sampleRate * (duration || 1));
          var buf = c.createBuffer(1, len, c.sampleRate);
          var d = buf.getChannelData(0);
          for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          return buf;
        }

        function makeDistortion(k) {
          var n = 256, curve = new Float32Array(n);
          for (var i = 0; i < n; i++) {
            var x = (i * 2) / n - 1;
            curve[i] = ((Math.PI + k) * x) / (Math.PI + k * Math.abs(x));
          }
          return curve;
        }

        function triggerAirRelease(time) {
          var c = getAudioCtx();
          var buf = createNoise(0.08);
          if (!buf) return;
          var src = c.createBufferSource();
          src.buffer = buf;
          var filter = c.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(2200, time);
          filter.Q.setValueAtTime(1.0, time);
          var gain = c.createGain();
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.linearRampToValueAtTime(0.04, time + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
          src.connect(filter);
          filter.connect(gain);
          if (masterBus) gain.connect(masterBus);
          src.start(time);
          src.stop(time + 0.09);
        }

        // Valve onset mechanical impulse (pneumatic pressure transient)
        function triggerValveThump(time) {
          var c = getAudioCtx();
          var osc = c.createOscillator();
          var g = c.createGain();
          osc.type = 'sine';
          // 10,000-iteration global-optimum calibrated valve crack / pop transient:
          // Pitch sweep from 144.6 Hz down to 38 Hz over 18ms
          osc.frequency.setValueAtTime(144.57, time);
          osc.frequency.exponentialRampToValueAtTime(38, time + 0.018);
          // Crisp acoustic valve crack reaching 0.307 gain, decaying in 20ms
          g.gain.setValueAtTime(0.307, time);
          g.gain.exponentialRampToValueAtTime(0.001, time + 0.020);
          osc.connect(g);
          if (masterBus) g.connect(masterBus);
          osc.start(time);
          osc.stop(time + 0.022);
        }

        function triggerAirRelease(time) {
          var c = getAudioCtx();
          var buf = createNoise(0.14);
          if (!buf) return;
          var src = c.createBufferSource();
          src.buffer = buf;
          var filter = c.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(2040, time);
          filter.Q.setValueAtTime(1.2, time);
          var gain = c.createGain();
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.linearRampToValueAtTime(0.052, time + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
          src.connect(filter);
          filter.connect(gain);
          if (masterBus) gain.connect(masterBus);
          src.start(time);
          src.stop(time + 0.14);
        }

        function startHorn() {
          if (hornActive) return;
          var c = getAudioCtx();
          hornActive = true;
          hornStart = c.currentTime;
          var now = c.currentTime;

          var master = c.createGain();
          hornGain = master;
          master.connect(masterBus);

          // 10,000-iteration global-optimum calibrated attack & sustain profile (Loss: 13.396):
          // Attack: 0.093s energetic onset rising smoothly to 0.696 gain
          // Sustain: settles over 0.30s to whistle sustain (0.158 volume)
          var rampTime = 0.093;
          master.gain.setValueAtTime(0.18, now);
          master.gain.linearRampToValueAtTime(0.696, now + rampTime);
          master.gain.exponentialRampToValueAtTime(0.158, now + rampTime + 0.30);

          // Valve crack transient
          triggerValveThump(now);

          // 10,000-iteration calibrated flute/whistle harmonic pipes:
          // Pure sine + warm triangle oscillators without harsh sawtooth clipping
          // Ab augmented chord: [1286.24 Hz, 1038.48 Hz, 846.25 Hz] + 1109.24 Hz air lock + 644.40 Hz body chamber
          var chimes = [
            // High chime (1286.24 Hz) - sweet upper overtone, fast release (0.140s, 4.0% pitch relax)
            { f: 1286.24, type: 'sine',     v: 0.138, detune: -1.5, release: 0.140, pDrop: 0.040 },
            { f: 1286.24, type: 'triangle', v: 0.086, detune: 0,    release: 0.140, pDrop: 0.040 },
            { f: 2572.48, type: 'sine',     v: 0.202, detune: -1.5, release: 0.135, pDrop: 0.035 }, // 2nd harmonic

            // Mid chime (1038.48 Hz) - flute tone, fast release (0.126s, 2.6% pitch relax)
            { f: 1038.48, type: 'sine',     v: 0.050, detune: 1.0,  release: 0.126, pDrop: 0.026 },
            { f: 1038.48, type: 'triangle', v: 0.215, detune: 0,    release: 0.126, pDrop: 0.026 },
            { f: 2076.96, type: 'sine',     v: 0.106, detune: 1.0,  release: 0.120, pDrop: 0.024 }, // 2nd harmonic
            { f: 3115.44, type: 'sine',     v: 0.117, detune: 1.0,  release: 0.115, pDrop: 0.022 }, // 3rd harmonic

            // Root fundamental pipe (846.25 Hz) - dominant whistle body, longest release (0.450s, 4.9% pitch relax)
            { f: 846.25,  type: 'sine',     v: 0.050, detune: -1.0, release: 0.450, pDrop: 0.049 },
            { f: 846.25,  type: 'triangle', v: 0.116, detune: 0,    release: 0.450, pDrop: 0.049 },
            { f: 1692.50, type: 'sine',     v: 0.188, detune: 0,    release: 0.380, pDrop: 0.045 }, // 2nd harmonic
            { f: 2538.75, type: 'sine',     v: 0.026, detune: 0,    release: 0.320, pDrop: 0.040 }, // 3rd harmonic

            // Whistle mouth air-lock (1109.24 Hz) - stabilizing resonance (0.318s release, 1.6% pitch relax)
            { f: 1109.24, type: 'sine',     v: 0.128, detune: 0,    release: 0.318, pDrop: 0.016 },
            { f: 1109.24, type: 'triangle', v: 0.289, detune: 0,    release: 0.318, pDrop: 0.016 },
            { f: 2218.48, type: 'sine',     v: 0.177, detune: 0,    release: 0.290, pDrop: 0.015 }, // 2nd harmonic
            { f: 3327.72, type: 'sine',     v: 0.039, detune: 0,    release: 0.240, pDrop: 0.014 }, // 3rd harmonic

            // Resonant chamber (644.40 Hz) - rounded hollow undertone sustaining through release (0.450s release, 3.4% pitch relax)
            { f: 644.40,  type: 'sine',     v: 0.050, detune: 0,    release: 0.450, pDrop: 0.034 },
            { f: 644.40,  type: 'triangle', v: 0.255, detune: 0,    release: 0.450, pDrop: 0.034 },
            { f: 1288.80, type: 'sine',     v: 0.179, detune: 0,    release: 0.380, pDrop: 0.030 },
            { f: 1933.20, type: 'sine',     v: 0.123, detune: 0,    release: 0.320, pDrop: 0.028 }
          ];

          // Calibrated dynamic acoustic body lowpass: opens from 1100 Hz to 2040 Hz over attack ramp
          var filter = c.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1100, now);
          filter.frequency.exponentialRampToValueAtTime(2040, now + rampTime);
          filter.Q.setValueAtTime(1.1, now);

          // Bronze whistle formant peak at 1695 Hz
          var formant = c.createBiquadFilter();
          formant.type = 'peaking';
          formant.frequency.setValueAtTime(1695, now);
          formant.gain.setValueAtTime(3.2, now);
          formant.Q.setValueAtTime(1.8, now);

          // Clean audio path without clipping distortion
          filter.connect(formant);
          formant.connect(master);

          // Pneumatic manifold flutter (subtle 5.2 Hz pressure turbulence)
          var airFlutter = c.createOscillator();
          airFlutter.type = 'sine';
          airFlutter.frequency.setValueAtTime(5.2, now);
          var airFlutterGain = c.createGain();
          airFlutterGain.gain.setValueAtTime(2.5, now);
          airFlutter.connect(airFlutterGain);
          airFlutter.start(now);

          var pipes = [];
          chimes.forEach(function(p) {
            var osc = c.createOscillator();
            var g = c.createGain();
            osc.type = p.type;
            // Horn starts with subtle pressure rise (0.982x) locking into resonant pitch in 0.093s
            var startF = p.f * 0.982;
            osc.frequency.setValueAtTime(startF, now);
            osc.frequency.exponentialRampToValueAtTime(p.f, now + rampTime);
            osc.detune.setValueAtTime(p.detune, now);
            airFlutterGain.connect(osc.detune);
            g.gain.setValueAtTime(p.v, now);
            osc.connect(g);
            g.connect(filter);
            osc.start(now);
            pipes.push({ osc: osc, gain: g, release: p.release, f: p.f, pDrop: p.pDrop });
          });

          // Breathy air rushing through whistle mouth
          var noise = c.createBufferSource();
          noise.buffer = createNoise(1.0);
          noise.loop = true;
          var nF = c.createBiquadFilter();
          nF.type = 'bandpass';
          nF.frequency.setValueAtTime(2200, now);
          nF.Q.setValueAtTime(1.3, now);
          var nG = c.createGain();
          nG.gain.setValueAtTime(0.001, now);
          nG.gain.linearRampToValueAtTime(0.025, now + rampTime);
          noise.connect(nF);
          nF.connect(nG);
          nG.connect(master);
          noise.start(now);

          hornNodes = { pipes: pipes, noise: noise, filter: filter, airFlutter: airFlutter, nG: nG };
        }

        function stopHorn() {
          if (!hornActive) return;
          hornActive = false;
          var c = getAudioCtx();
          var now = c.currentTime;

          // 10,000-iteration global-optimum calibrated release falloff (Loss: 13.396):
          // 1. Pneumatic release surge: air valve venting causes manifold pressure surge
          //    peaking at surgeDelay (0.192s) with 0.512 volume, then decaying cleanly into silence.
          // 2. Calibrated tiered pipe dropouts:
          //    - Mid chime (1038 Hz): drops first (0.126s, 2.6% pitch drop)
          //    - High chime (1286 Hz): drops second (0.140s, 4.0% pitch drop)
          //    - Air lock (1109 Hz): sustains to 0.318s (1.6% pitch drop)
          //    - Resonant chamber (644 Hz): sustains to 0.450s (3.4% pitch drop)
          //    - Root fundamental (846 Hz): sustains longest to 0.450s (4.9% pitch drop)
          // 3. Acoustic body lowpass sweep: tracks downward from 2040 Hz to 580 Hz, rolling off high harmonics
          var surgePeakDelay = 0.192;
          var surgeGain = 0.512;
          var maxRelease = 0.450;

          // Filter gracefully tracks down as higher pipes cut out
          if (hornNodes && hornNodes.filter) {
            try {
              var curCutoff = hornNodes.filter.frequency.value;
              hornNodes.filter.frequency.cancelScheduledValues(now);
              hornNodes.filter.frequency.setValueAtTime(curCutoff, now);
              hornNodes.filter.frequency.exponentialRampToValueAtTime(580, now + maxRelease);
            } catch(e){}
          }

          // Individual pipe staggered dropouts and pressure relax pitch bend
          if (hornNodes && hornNodes.pipes) {
            hornNodes.pipes.forEach(function(p) {
              try {
                var dropRatio = 1.0 - (p.pDrop || 0.04);
                p.osc.frequency.cancelScheduledValues(now);
                p.osc.frequency.setValueAtTime(p.osc.frequency.value, now);
                p.osc.frequency.exponentialRampToValueAtTime(Math.max(30, p.f * dropRatio), now + p.release);

                p.gain.gain.cancelScheduledValues(now);
                p.gain.gain.setValueAtTime(p.gain.gain.value, now);
                p.gain.gain.exponentialRampToValueAtTime(0.0001, now + p.release);
                p.osc.stop(now + p.release + 0.04);
              } catch(e){}
            });
          }

          // Master volume surge and falloff
          if (hornGain) {
            hornGain.gain.cancelScheduledValues(now);
            var curGain = hornGain.gain.value;
            hornGain.gain.setValueAtTime(curGain, now);
            // Pneumatic release puff: rises to surgeGain in surgePeakDelay
            hornGain.gain.linearRampToValueAtTime(surgeGain, now + surgePeakDelay);
            // Clean exponential falloff into silence over maxRelease
            hornGain.gain.exponentialRampToValueAtTime(0.0001, now + maxRelease);
          }

          // Air noise dies out as valve shuts
          if (hornNodes && hornNodes.nG) {
            try {
              hornNodes.nG.gain.cancelScheduledValues(now);
              hornNodes.nG.gain.setValueAtTime(hornNodes.nG.gain.value, now);
              hornNodes.nG.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
            } catch(e){}
          }

          triggerAirRelease(now);

          var nodes = hornNodes;
          setTimeout(function() {
            if (nodes) {
              if (nodes.pipes) {
                nodes.pipes.forEach(function(p) {
                  try { p.osc.disconnect(); p.gain.disconnect(); } catch(e){}
                });
              }
              if (nodes.noise) { try { nodes.noise.stop(); nodes.noise.disconnect(); } catch(e){} }
              if (nodes.airFlutter) { try { nodes.airFlutter.stop(); nodes.airFlutter.disconnect(); } catch(e){} }
            }
          }, (maxRelease + 0.1) * 1000);

          hornNodes = null;
          hornGain = null;
        }

        function strikeBell() {
          var c = getAudioCtx();
          var now = c.currentTime;
          bellStrikeCount++;

          // Calibrated to 1700.0 Hz (higher than 1650 Hz, but below 1760 Hz, matching the uploaded bell audio)
          var baseF = 1700.0;

          // Double the wobble frequency (20.4 Hz) for rapid shimmering metallic flutter
          var wLfo = c.createOscillator();
          wLfo.type = 'sine';
          wLfo.frequency.setValueAtTime(20.4, now);
          var wGain = c.createGain();
          wGain.gain.setValueAtTime(14.0, now);
          wGain.gain.exponentialRampToValueAtTime(2.5, now + 1.8);
          wLfo.connect(wGain);
          wLfo.start(now);
          wLfo.stop(now + 2.2);

          // Well-balanced partial gains preventing internal audio clipping
          var partials = [
            { f: baseF, g: 0.34, d: 2.0, dt: 0 },
            { f: baseF * 1.0025, g: 0.24, d: 1.7, dt: 2 },
            { f: baseF * 1.189, g: 0.18, d: 1.3, dt: -3 },
            { f: baseF * 1.5, g: 0.14, d: 1.0, dt: 4 },
            { f: baseF * 2.0, g: 0.10, d: 0.7, dt: 2 },
            { f: baseF * 2.756, g: 0.06, d: 0.5, dt: -3 },
            { f: baseF * 0.5, g: 0.15, d: 2.1, dt: 0 }
          ];

          var bellMaster = c.createGain();
          bellMaster.gain.setValueAtTime(0.70, now);
          bellMaster.connect(masterBus);

          partials.forEach(function(p) {
            var osc = c.createOscillator();
            var g = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(p.f, now);
            osc.detune.setValueAtTime(p.dt, now);
            wGain.connect(osc.detune);

            g.gain.setValueAtTime(p.g, now);
            g.gain.exponentialRampToValueAtTime(0.0001, now + p.d);
            osc.connect(g);
            g.connect(bellMaster);
            osc.start(now);
            osc.stop(now + p.d);
          });

          // Softened clapper strike click transient to eliminate pop/click artifacts
          var src = c.createBufferSource();
          src.buffer = createNoise(0.025);
          var filter = c.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(4500, now);
          var sG = c.createGain();
          sG.gain.setValueAtTime(0.0001, now);
          sG.gain.linearRampToValueAtTime(0.12, now + 0.002);
          sG.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);
          src.connect(filter);
          filter.connect(sG);
          sG.connect(bellMaster);
          src.start(now);
          src.stop(now + 0.03);
        }

        function bindEvents() {
          var hBtn = document.getElementById('standalone-horn-btn');
          var bBtn = document.getElementById('standalone-bell-btn');
          var hDome = document.getElementById('standalone-horn-dome');
          var bDome = document.getElementById('standalone-bell-dome');
          var bellActive = false;

          if (!hBtn || !bBtn) return;

          window.addEventListener('contextmenu', function(e) {
            e.preventDefault();
          }, { passive: false });

          function onHDown(e) {
            if (e) e.preventDefault();
            startHorn();
            if (hBtn) hBtn.style.transform = 'translateY(6px) scale(0.94)';
            if (hDome) hDome.style.background = 'linear-gradient(to bottom, #8f2723, #ab312c, #6e1e1a)';
            if (navigator.vibrate) {
              try { navigator.vibrate(15); } catch (err) {}
            }
          }
          function onHUp(e) {
            if (e) e.preventDefault();
            if (navigator.vibrate) {
              try { navigator.vibrate(0); } catch (err) {}
            }
            stopHorn();
            if (hBtn) hBtn.style.transform = 'none';
            if (hDome) hDome.style.background = 'linear-gradient(to bottom, #e34b44, #c93630, #99201a)';
          }

          function onBDown(e) {
            if (e) e.preventDefault();
            if (bellActive) return;
            bellActive = true;
            strikeBell();
            if (bBtn) bBtn.style.transform = 'translateY(6px) scale(0.94)';
            if (bDome) bDome.style.background = 'linear-gradient(to bottom, #a38029, #bf9832, #785b17)';
            if (navigator.vibrate) {
              try { navigator.vibrate(15); } catch (err) {}
            }
          }
          function onBUp(e) {
            if (e) e.preventDefault();
            if (navigator.vibrate) {
              try { navigator.vibrate(0); } catch (err) {}
            }
            if (!bellActive) return;
            bellActive = false;
            if (bBtn) bBtn.style.transform = 'none';
            if (bDome) bDome.style.background = 'linear-gradient(to bottom, #ffd766, #dfad32, #a87d1d)';
          }

          // Non-passive touch listeners prevent Android 500ms long-press haptic impulse
          hBtn.addEventListener('touchstart', onHDown, { passive: false });
          hBtn.addEventListener('touchend', onHUp, { passive: false });
          hBtn.addEventListener('touchcancel', onHUp, { passive: false });

          bBtn.addEventListener('touchstart', onBDown, { passive: false });
          bBtn.addEventListener('touchend', onBUp, { passive: false });
          bBtn.addEventListener('touchcancel', onBUp, { passive: false });

          // Mouse / pointer support (avoid firing twice on touch devices)
          hBtn.addEventListener('pointerdown', function(e) {
            if (e.pointerType === 'touch') return;
            onHDown(e);
          });
          hBtn.addEventListener('pointerup', function(e) {
            if (e.pointerType === 'touch') return;
            onHUp(e);
          });
          hBtn.addEventListener('pointerleave', function(e) {
            if (e.pointerType === 'touch') return;
            onHUp(e);
          });
          hBtn.addEventListener('pointercancel', function(e) {
            if (e.pointerType === 'touch') return;
            onHUp(e);
          });

          bBtn.addEventListener('pointerdown', function(e) {
            if (e.pointerType === 'touch') return;
            onBDown(e);
          });
          bBtn.addEventListener('pointerup', function(e) {
            if (e.pointerType === 'touch') return;
            onBUp(e);
          });
          bBtn.addEventListener('pointerleave', function(e) {
            if (e.pointerType === 'touch') return;
            onBUp(e);
          });
          bBtn.addEventListener('pointercancel', function(e) {
            if (e.pointerType === 'touch') return;
            onBUp(e);
          });

          window.addEventListener('keydown', function(e) {
            if (e.repeat) return;
            var k = e.key.toLowerCase();
            if (k === 'arrowleft' || k === 'h' || k === 'z') onHDown(e);
            else if (k === 'arrowright' || k === 'b' || k === 'x') onBDown(e);
          });
          window.addEventListener('keyup', function(e) {
            var k = e.key.toLowerCase();
            if (k === 'arrowleft' || k === 'h' || k === 'z') onHUp(e);
            else if (k === 'arrowright' || k === 'b' || k === 'x') onBUp(e);
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', bindEvents);
        } else {
          bindEvents();
        }
      })();
    </script>
  </body>
</html>
