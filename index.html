<!--
================================================================================
MAINTAINER NOTES
================================================================================

minimal-service-worker-rule:
This application should always be maintained to function fully as a single HTML
file without a service worker whenever possible. The service-worker.js is
strictly progressive enhancement for offline asset caching and PWA
installability on mobile/desktop browsers. Core sound board audio and UI logic
must never depend on the service worker being present or active.

ladybug-rule:
The ladybug icon (#ladybug-log-btn) serves as a visual build indicator and
diagnostic log tool. Between development updates, alternate its position among
the 4 predetermined corners of the control console so maintainers and users can
easily verify that the most up-to-date version is loaded:
  Position 1 (top-right):    top: 8px; right: 12px;
  Position 2 (bottom-right): bottom: 8px; right: 12px;
  Position 3 (bottom-left):  bottom: 8px; left: 12px;
  Position 4 (top-left):     top: 8px; left: 12px;
When making a development change, advance the ladybug to the next coordinate
in this cycle (or specify which position it is currently in).
================================================================================
-->

    <!-- Isolated Sub-Sample Web Audio Engine (.mp4 AAC 256kbps @ 44.1kHz):
         - Bell: Isolated bell_clean.mp4 (1.2500s) played on cue with polyphonic layering
         - Horn: Decomposed into isolated horn_attack.mp4 (0.2200s), C^inf-periodic de-pulsed
                 horn_sustain.mp4 (1.1000s), and monotonic horn_release.mp4 (0.3300s) -->
    <script>
      (function() {
        var SAMPLE_RATE = 44100;
        var HORN_ATTACK_SAMPLES = 9702;
        var HORN_SUSTAIN_SAMPLES = 48510;
        var HORN_RELEASE_SAMPLES = 14553;
        var BELL_SAMPLES = 55125;

        var AUDIO_FILES = {
          bell: 'bell_clean.mp4',
          hornAttack: 'horn_attack.mp4',
          hornSustain: 'horn_sustain.mp4',
          hornRelease: 'horn_release.mp4'
        };

        var PCM_DATA = {
          ready: false,
          bell: new Float32Array(BELL_SAMPLES),
          hornAttack: new Float32Array(HORN_ATTACK_SAMPLES),
          hornSustain: new Float32Array(HORN_SUSTAIN_SAMPLES),
          hornRelease: new Float32Array(HORN_RELEASE_SAMPLES),
          hornAttackSustain: new Float32Array(HORN_ATTACK_SAMPLES + HORN_SUSTAIN_SAMPLES)
        };



        // Pre-compute equal-power crossfade curves for Horn release transitions
        var XFADE_CURVE_LEN = 256;
        var FADE_OUT_CURVE = new Float32Array(XFADE_CURVE_LEN);
        var FADE_IN_CURVE = new Float32Array(XFADE_CURVE_LEN);
        for (var k = 0; k < XFADE_CURVE_LEN; k++) {
          var theta = 0.5 * Math.PI * (k / (XFADE_CURVE_LEN - 1));
          FADE_OUT_CURVE[k] = Math.cos(theta);
          FADE_IN_CURVE[k] = Math.sin(theta);
        }

        // --- Verbose Diagnostic In-Memory Logger ---
        var logHistory = [];
        var glitchMetrics = {
          discontinuitiesDetected: 0,
          maxSampleStep: 0,
          maxPeakLevel: 0,
          activeVoiceCount: 0,
          totalHornStarts: 0,
          totalHornStops: 0,
          totalBellStrikes: 0
        };

        function log(category, message, data) {
          var now = new Date();
          var timeStr = now.toISOString().substring(11, 23);
          var entry = '[' + timeStr + '][' + category + '] ' + message;
          if (data !== undefined) {
            try {
              if (typeof data === 'object') entry += ' | ' + JSON.stringify(data);
              else entry += ' | ' + String(data);
            } catch (err) {
              entry += ' | [unstringifiable data]';
            }
          }
          logHistory.push(entry);
          if (logHistory.length > 500) logHistory.shift();
          try {
            console.log(entry);
          } catch (e) {}
        }

        window.addEventListener('error', function(e) {
          log('ERROR', 'Global window error: ' + (e.message || 'unknown'), {
            filename: e.filename,
            lineno: e.lineno,
            colno: e.colno
          });
        });

        window.addEventListener('unhandledrejection', function(e) {
          log('PROMISE-REJECT', 'Unhandled Promise: ' + (e.reason ? (e.reason.message || String(e.reason)) : 'unknown'));
        });

        log('ENV', 'UserAgent: ' + navigator.userAgent);
        log('ENV', 'Platform: ' + navigator.platform + ', maxTouchPoints: ' + (navigator.maxTouchPoints || 0));
        log('ENV', 'Model: Isolated Sub-Sample Engine (.mp4 AAC 256kbps)', {
          sampleRate: SAMPLE_RATE,
          files: AUDIO_FILES,
          bellSec: Number((BELL_SAMPLES / SAMPLE_RATE).toFixed(4)),
          hornAttackSec: Number((HORN_ATTACK_SAMPLES / SAMPLE_RATE).toFixed(4)),
          hornSustainSec: Number((HORN_SUSTAIN_SAMPLES / SAMPLE_RATE).toFixed(4)),
          hornReleaseSec: Number((HORN_RELEASE_SAMPLES / SAMPLE_RATE).toFixed(4))
        });

        // iOS: WebKit gives Web-Audio-only pages the 'ambient' audio session, which the Ring/Silent switch
        // mutes while the AudioContext still reports 'running'. Request 'playback' (Safari/WKWebView 16.4+).
        if (navigator.audioSession) {
          try { navigator.audioSession.type = 'playback'; } catch (e) { log('AUDIO-ERR', 'audioSession.type=playback failed: ' + e.message); }
        }
        log('ENV', 'isSecureContext=' + window.isSecureContext + ', audioSession=' + (navigator.audioSession ? navigator.audioSession.type : 'unavailable'));
        document.addEventListener('visibilitychange', function() {
          log('ENV', 'visibilitychange -> ' + document.visibilityState + (ctx ? ' (ctx ' + ctx.state + ' t=' + ctx.currentTime.toFixed(3) + ')' : ''));
        });

        var ctx = null;
        var masterBus = null;
        var liveBuffers = null;
        var isAudioUnlocked = false;
        var hornActive = false;
        var activeHornVoice = null;
        var activeBellVoices = [];
        var bellStrikeCount = 0;
        var mp4DecodePromise = null;
        var outAnalyser = null;

        function ensureMp4Decoded() {
          if (PCM_DATA.ready) return Promise.resolve(PCM_DATA);
          if (mp4DecodePromise) return mp4DecodePromise;
          var OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
          var decCtx = new OfflineCtx(1, 1, SAMPLE_RATE);

          function fetchAndDecode(url, expectedLen) {
            return fetch(url)
              .then(function(resp) {
                if (!resp.ok) throw new Error('HTTP ' + resp.status + ' fetching ' + url);
                return resp.arrayBuffer();
              })
              .then(function(arrBuf) {
                return decCtx.decodeAudioData(arrBuf);
              })
              .then(function(audioBuf) {
                var ch = audioBuf.getChannelData(0);
                var peak = 0;
                for (var i = 0; i < ch.length; i++) peak = Math.max(peak, Math.abs(ch[i]));
                log('AUDIO', 'Decoded ' + url, { length: ch.length, expected: expectedLen, sampleRate: audioBuf.sampleRate, channels: audioBuf.numberOfChannels, peak: Number(peak.toFixed(4)) });
                var out = new Float32Array(expectedLen);
                out.set(ch.subarray(0, Math.min(ch.length, expectedLen)));
                return out;
              });
          }

          mp4DecodePromise = Promise.all([
            fetchAndDecode(AUDIO_FILES.bell, BELL_SAMPLES),
            fetchAndDecode(AUDIO_FILES.hornAttack, HORN_ATTACK_SAMPLES),
            fetchAndDecode(AUDIO_FILES.hornSustain, HORN_SUSTAIN_SAMPLES),
            fetchAndDecode(AUDIO_FILES.hornRelease, HORN_RELEASE_SAMPLES)
          ]).then(function(res) {
            PCM_DATA.bell = res[0];
            PCM_DATA.hornAttack = res[1];
            PCM_DATA.hornSustain = res[2];
            PCM_DATA.hornRelease = res[3];
            // Combined contiguous [hornAttack, hornSustain] array so Attack -> Sustain handoff
            // and native AudioBufferSourceNode loop (loopStart..loopEnd) have zero sample-rate rounding jitter
            PCM_DATA.hornAttackSustain = new Float32Array(PCM_DATA.hornAttack.length + PCM_DATA.hornSustain.length);
            PCM_DATA.hornAttackSustain.set(PCM_DATA.hornAttack, 0);
            PCM_DATA.hornAttackSustain.set(PCM_DATA.hornSustain, PCM_DATA.hornAttack.length);
            PCM_DATA.ready = true;
            if (ctx) {
              liveBuffers = createBuffersForContext(ctx);
            }
            log('AUDIO', 'Loaded and decoded .mp4 sub-samples via fetch + decodeAudioData', {
              bellSamples: PCM_DATA.bell.length,
              hornAttackSamples: PCM_DATA.hornAttack.length,
              hornSustainSamples: PCM_DATA.hornSustain.length,
              hornReleaseSamples: PCM_DATA.hornRelease.length
            });
            return PCM_DATA;
          }).catch(function(err) {
            log('AUDIO-ERR', 'Failed loading .mp4 sub-samples: ' + (err ? err.message : 'unknown'));
            throw err;
          });
          return mp4DecodePromise;
        }

        // Kick off MP4 preloading immediately on script load
        ensureMp4Decoded();


        function createBuffersForContext(targetCtx) {
          function makeBuf(f32) {
            var buf = targetCtx.createBuffer(1, f32.length, SAMPLE_RATE);
            buf.getChannelData(0).set(f32);
            return buf;
          }
          return {
            bell: makeBuf(PCM_DATA.bell),
            hornAttack: makeBuf(PCM_DATA.hornAttack),
            hornSustain: makeBuf(PCM_DATA.hornSustain),
            hornRelease: makeBuf(PCM_DATA.hornRelease),
            hornAttackSustain: makeBuf(PCM_DATA.hornAttackSustain),
            attackDuration: HORN_ATTACK_SAMPLES / SAMPLE_RATE,
            sustainDuration: HORN_SUSTAIN_SAMPLES / SAMPLE_RATE,
            releaseDuration: HORN_RELEASE_SAMPLES / SAMPLE_RATE,
            bellDuration: BELL_SAMPLES / SAMPLE_RATE
          };
        }

        function buildMasterBusForContext(targetCtx) {
          var busGain = targetCtx.createGain();
          busGain.gain.setValueAtTime(0.92, targetCtx.currentTime);

          // Gentle master limiter to prevent clipping when horn + multiple bell strikes layer
          var comp = targetCtx.createDynamicsCompressor();
          comp.threshold.setValueAtTime(-2.5, targetCtx.currentTime);
          comp.knee.setValueAtTime(6.0, targetCtx.currentTime);
          comp.ratio.setValueAtTime(8.0, targetCtx.currentTime);
          comp.attack.setValueAtTime(0.002, targetCtx.currentTime);
          comp.release.setValueAtTime(0.080, targetCtx.currentTime);

          busGain.connect(comp);
          comp.connect(targetCtx.destination);
          return busGain;
        }

        function unlockIOSAudio(c) {
          if (!c) return;
          if (isAudioUnlocked && c.state === 'running') return;
          try {
            var silentBuf = c.createBuffer(1, 1, 22050);
            var src = c.createBufferSource();
            src.buffer = silentBuf;
            src.connect(c.destination);
            src.start(0);
            isAudioUnlocked = true;
          } catch (e) {}
        }

        function getAudioCtx() {
          if (!ctx) {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) {
              log('AUDIO-ERR', 'Web Audio API not supported in this browser!');
              return null;
            }
            try {
              ctx = new AudioCtx({ latencyHint: 'interactive' });
            } catch (e) {
              ctx = new AudioCtx();
            }
            masterBus = buildMasterBusForContext(ctx);
            outAnalyser = ctx.createAnalyser();
            outAnalyser.fftSize = 2048;
            masterBus.connect(outAnalyser);
            ctx.onstatechange = function() {
              log('AUDIO', 'AudioContext statechange -> ' + ctx.state + ' @ t=' + ctx.currentTime.toFixed(3));
            };
            liveBuffers = createBuffersForContext(ctx);
            log('AUDIO', 'Created AudioContext & isolated sample buffers', {
              state: ctx.state,
              sampleRate: ctx.sampleRate,
              baseLatency: ctx.baseLatency,
              outputLatency: ctx.outputLatency
            });
          }
          if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
            ctx.resume().then(function() {
              log('AUDIO', 'AudioContext resumed (' + ctx.state + ')');
            }).catch(function(err) {
              log('AUDIO-ERR', 'Failed to resume AudioContext: ' + err.message);
            });
          }
          unlockIOSAudio(ctx);
          return ctx;
        }

        // Peak of what the graph actually outputs ~150ms after a trigger. Non-zero while nothing is
        // audible => the OS muted/misrouted it (e.g. iOS silent switch), not the sample engine.
        function logOutputLevel(tag) {
          if (!outAnalyser) return;
          setTimeout(function() {
            var buf = new Float32Array(outAnalyser.fftSize);
            outAnalyser.getFloatTimeDomainData(buf);
            var peak = 0;
            for (var i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i]));
            glitchMetrics.maxPeakLevel = Math.max(glitchMetrics.maxPeakLevel, Number(peak.toFixed(4)));
            log('LEVEL', tag + ' graph output peak=' + peak.toFixed(4) + ' (ctx ' + ctx.state + ' t=' + ctx.currentTime.toFixed(3) + ')');
          }, 150);
        }

        // =====================================================================
        // HORN SUB-SAMPLE ENGINE (Attack -> Looping Sustain -> Release/Decay)
        //   - On Press (startHorn): Plays isolated horn_attack.mp4 (0.2200s) and
        //     seamlessly transitions at exact sample 9,702 into C^inf-periodic
        //     de-pulsed horn_sustain.mp4 (1.1000s) for as long as the button is held.
        //   - On Release (stopHorn): Handles any hold duration (from micro-taps
        //     <95ms up to infinite sustain holds) via a 25ms equal-power
        //     crossfade into isolated horn_release.mp4 (0.3300s).
        // =====================================================================
        var MIN_ATTACK_HOLD_SEC = 0.095;
        var RELEASE_XFADE_SEC = 0.025;

        function startHorn(targetCtx, targetDest, startTimeOverride, buffersOverride) {
          var isOffline = !!(targetCtx && targetDest);
          if (!isOffline && hornActive) return activeHornVoice;

          var c = targetCtx || getAudioCtx();
          if (!c) return null;
          if (!isOffline && !PCM_DATA.ready) {
            ensureMp4Decoded().then(function() {
              startHorn();
            });
            return null;
          }
          var dest = targetDest || masterBus;
          var bufs = buffersOverride || (c === ctx ? liveBuffers : createBuffersForContext(c));
          var now = (startTimeOverride !== undefined) ? startTimeOverride : c.currentTime;

          if (!isOffline) {
            hornActive = true;
            glitchMetrics.totalHornStarts++;
            glitchMetrics.activeVoiceCount++;
          }

          var voiceMaster = c.createGain();
          voiceMaster.gain.setValueAtTime(0.95, now);
          voiceMaster.connect(dest);

          var sustainGain = c.createGain();
          // Tiny 1.5ms onset ramp from 0 to 1 prevents any sub-sample trigger click
          sustainGain.gain.setValueAtTime(0.0, now);
          sustainGain.gain.linearRampToValueAtTime(1.0, now + 0.0015);
          sustainGain.connect(voiceMaster);

          // Play hornAttackSustain buffer:
          // [0 .. attackDuration] = isolated horn_attack.mp4
          // [attackDuration .. attackDuration + sustainDuration] = isolated horn_sustain.mp4 (looped)
          var src = c.createBufferSource();
          src.buffer = bufs.hornAttackSustain;
          src.loop = true;
          src.loopStart = bufs.attackDuration;
          src.loopEnd = bufs.attackDuration + bufs.sustainDuration;
          src.connect(sustainGain);
          src.start(now);

          var voice = {
            ctx: c,
            buffers: bufs,
            startTime: now,
            voiceMaster: voiceMaster,
            sustainGain: sustainGain,
            src: src,
            released: false
          };

          if (!isOffline) {
            activeHornVoice = voice;
            log('HORN', 'Started Horn Attack -> Sustain Loop', {
              startTime: Number(now.toFixed(3)),
              loopStart: Number(src.loopStart.toFixed(4)),
              loopEnd: Number(src.loopEnd.toFixed(4))
            });
            logOutputLevel('HORN');
          }
          return voice;
        }

        function stopHorn(voiceOverride, stopTimeOverride) {
          var voice = voiceOverride || activeHornVoice;
          if (!voice || voice.released) return;
          if (!voiceOverride && !hornActive) return;

          voice.released = true;
          if (!voiceOverride) {
            hornActive = false;
            activeHornVoice = null;
            glitchMetrics.totalHornStops++;
          }

          try {
            var c = voice.ctx;
            var bufs = voice.buffers;
            var now = (stopTimeOverride !== undefined) ? stopTimeOverride : c.currentTime;
            var rawElapsed = Math.max(0.0, now - voice.startTime);

            // Ensure micro-taps (< 95ms) play at least 95ms of the attack transient before crossfading to release.
            // On live touch, ensure tRel has a safe 3ms lead over audio rendering quantum to prevent Chrome auto-clamping desync.
            var minRelTime = (stopTimeOverride !== undefined) ? now : (c.currentTime + 0.003);
            var tRel = Math.max(minRelTime, voice.startTime + MIN_ATTACK_HOLD_SEC);
            var effectiveHold = tRel - voice.startTime;

            // Scale release slightly on ultra-brief taps (< 160ms) so envelope matches attack level
            var relScale = (effectiveHold < 0.160) ? (0.78 + 0.22 * (effectiveHold / 0.160)) : 1.0;

            // 1) Equal-power cosine fade-out on the active Attack/Sustain stream over RELEASE_XFADE_SEC (25ms)
            try {
              voice.sustainGain.gain.cancelScheduledValues(tRel);
              voice.sustainGain.gain.setValueCurveAtTime(FADE_OUT_CURVE, tRel, RELEASE_XFADE_SEC);
              voice.src.stop(tRel + RELEASE_XFADE_SEC + 0.020);
            } catch (eFade) {
              log('HORN-WARN', 'setValueCurveAtTime fade-out fallback: ' + eFade.message);
              try {
                voice.sustainGain.gain.cancelScheduledValues(tRel);
                voice.sustainGain.gain.linearRampToValueAtTime(0.0001, tRel + RELEASE_XFADE_SEC);
                voice.src.stop(tRel + RELEASE_XFADE_SEC + 0.020);
              } catch (eFade2) {}
            }

            // 2) Equal-power sine fade-in on isolated horn_release.mp4 starting at tRel
            var relGain = c.createGain();
            relGain.gain.value = 0.0;
            var scaledFadeIn = new Float32Array(XFADE_CURVE_LEN);
            for (var i = 0; i < XFADE_CURVE_LEN; i++) {
              scaledFadeIn[i] = FADE_IN_CURVE[i] * relScale;
            }
            try {
              relGain.gain.setValueCurveAtTime(scaledFadeIn, tRel, RELEASE_XFADE_SEC);
            } catch (eCurveIn) {
              log('HORN-WARN', 'setValueCurveAtTime fade-in fallback: ' + eCurveIn.message);
              try {
                relGain.gain.setValueAtTime(0.0001, tRel);
                relGain.gain.linearRampToValueAtTime(relScale, tRel + RELEASE_XFADE_SEC);
              } catch (eCurveIn2) {}
            }
            relGain.connect(voice.voiceMaster);

            var relSrc = c.createBufferSource();
            relSrc.buffer = bufs.hornRelease;
            relSrc.connect(relGain);
            relSrc.start(tRel);
            var tEnd = tRel + bufs.releaseDuration;
            relSrc.stop(tEnd + 0.020);

            if (!voiceOverride) {
              setTimeout(function() {
                try {
                  voice.voiceMaster.disconnect();
                  glitchMetrics.activeVoiceCount = Math.max(0, glitchMetrics.activeVoiceCount - 1);
                } catch (e) {}
              }, Math.ceil((tEnd - c.currentTime + 0.05) * 1000));
              log('HORN', 'Scheduled Horn Release sub-sample transition', {
                rawHoldMs: Math.round(rawElapsed * 1000),
                effectiveHoldMs: Math.round(effectiveHold * 1000),
                xfadeMs: Math.round(RELEASE_XFADE_SEC * 1000)
              });
            }
          } catch (e) {
            log('HORN-ERR', 'stopHorn error: ' + e.message);
          }
        }

        // =====================================================================
        // ISOLATED BELL SAMPLE PLAYBACK (bell_clean.mp4, 1.2500s)
        // Straightforward sample playback on cue with polyphonic layering.
        // =====================================================================
        function strikeBell(targetCtx, targetDest, startTimeOverride, buffersOverride) {
          var isOffline = !!(targetCtx && targetDest);
          var c = targetCtx || getAudioCtx();
          if (!c) return;
          if (!isOffline && !PCM_DATA.ready) {
            ensureMp4Decoded().then(function() {
              strikeBell();
            });
            return;
          }
          var dest = targetDest || masterBus;
          var bufs = buffersOverride || (c === ctx ? liveBuffers : createBuffersForContext(c));
          var now = (startTimeOverride !== undefined) ? startTimeOverride : c.currentTime;

          bellStrikeCount++;
          if (!isOffline) glitchMetrics.totalBellStrikes++;

          // Prune finished bell voices
          activeBellVoices = activeBellVoices.filter(function(v) {
            return v.ctx === c && (now - v.startTime) >= 0 && (now - v.startTime) < bufs.bellDuration;
          });
          if (!isOffline && activeBellVoices.length >= 10) {
            var oldest = activeBellVoices.shift();
            try {
              oldest.voiceGain.gain.cancelScheduledValues(now);
              oldest.voiceGain.gain.setValueAtTime(oldest.scale, now);
              oldest.voiceGain.gain.linearRampToValueAtTime(0.0001, now + 0.025);
              oldest.src.stop(now + 0.030);
            } catch (e) {}
          }

          var polyCount = activeBellVoices.length;
          var polyScale = 0.88 / Math.sqrt(1.0 + 0.28 * polyCount);
          // Subtle +/- 1.2 cents detuning across rapid repeated strikes prevents comb filtering
          var detuneCents = ((bellStrikeCount % 5) - 2) * 0.6;

          var voiceGain = c.createGain();
          voiceGain.gain.setValueAtTime(polyScale, now);
          voiceGain.connect(dest);

          var src = c.createBufferSource();
          src.buffer = bufs.bell;
          src.detune.setValueAtTime(detuneCents, now);
          src.connect(voiceGain);
          src.start(now);
          src.stop(now + bufs.bellDuration + 0.01);

          var vObj = { ctx: c, startTime: now, voiceGain: voiceGain, src: src, scale: polyScale };
          activeBellVoices.push(vObj);

          if (!isOffline) {
            glitchMetrics.activeVoiceCount++;
            setTimeout(function() {
              try {
                voiceGain.disconnect();
                glitchMetrics.activeVoiceCount = Math.max(0, glitchMetrics.activeVoiceCount - 1);
                activeBellVoices = activeBellVoices.filter(function(v) { return v !== vObj; });
              } catch (e) {}
            }, Math.ceil((bufs.bellDuration + 0.04) * 1000));
            log('BELL', 'Bell sample strike #' + bellStrikeCount + ' (activeLayeredVoices=' + activeBellVoices.length + ')');
            logOutputLevel('BELL');
          }
        }

        // --- OfflineAudioContext Glitch & Multi-Duration Verification Hook ---
        async function runOfflineVerification() {
          await ensureMp4Decoded();
          var OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
          var sr = SAMPLE_RATE;
          var dur = 6.2;
          var offCtx = new OfflineCtx(1, Math.floor(sr * dur), sr);
          var offBus = buildMasterBusForContext(offCtx);
          var offBufs = createBuffersForContext(offCtx);

          // Test 1: Ultra-short micro-tap (30ms button press -> 95ms min attack + release)
          var hv1 = startHorn(offCtx, offBus, 0.05, offBufs);
          stopHorn(hv1, 0.08);

          // Test 2: Mid-attack interrupt (160ms button press -> crossfades during attack into release)
          var hv2 = startHorn(offCtx, offBus, 0.60, offBufs);
          stopHorn(hv2, 0.76);

          // Test 3: Multi-loop sustain hold (1.30s to 4.10s = 2.80s hold, looping horn_sustain > 2 times!)
          var hv3 = startHorn(offCtx, offBus, 1.30, offBufs);
          stopHorn(hv3, 4.10);

          // Test 4: Rapid layered Bell strikes (4.60s, 4.72s, 4.84s)
          strikeBell(offCtx, offBus, 4.60, offBufs);
          strikeBell(offCtx, offBus, 4.72, offBufs);
          strikeBell(offCtx, offBus, 4.84, offBufs);

          var rendered = await offCtx.startRendering();
          var pcm = rendered.getChannelData(0);
          var maxPeak = 0;
          var maxHornStep = 0;
          var maxBellStep = 0;
          var nanCount = 0;
          var glitchSpikes = 0;
          var bellStartSample = Math.floor(4.55 * sr);
          for (var i = 0; i < pcm.length; i++) {
            var v = pcm[i];
            if (!isFinite(v)) { nanCount++; continue; }
            var av = Math.abs(v);
            if (av > maxPeak) maxPeak = av;
            if (i > 0) {
              var step = Math.abs(v - pcm[i - 1]);
              if (i < bellStartSample) {
                if (step > maxHornStep) maxHornStep = step;
                if (step > 0.32) glitchSpikes++;
              } else {
                if (step > maxBellStep) maxBellStep = step;
                if (step > 0.48) glitchSpikes++;
              }
            }
          }
          return {
            model: 'isolated_subsamples_attack_sustain_release_mp4',
            sampleRate: sr,
            durationSec: dur,
            subSamples: {
              bellSec: Number(offBufs.bellDuration.toFixed(4)),
              hornAttackSec: Number(offBufs.attackDuration.toFixed(4)),
              hornSustainSec: Number(offBufs.sustainDuration.toFixed(4)),
              hornReleaseSec: Number(offBufs.releaseDuration.toFixed(4))
            },
            maxPeak: Number(maxPeak.toFixed(4)),
            maxHornSampleStep: Number(maxHornStep.toFixed(4)),
            maxBellSampleStep: Number(maxBellStep.toFixed(4)),
            nanCount: nanCount,
            glitchSpikes: glitchSpikes,
            passed: (nanCount === 0 && maxPeak > 0.25 && maxPeak <= 1.05 && glitchSpikes === 0)
          };
        }

        window.__trainAudioTest = {
          modelType: 'isolated_subsamples_mp4',
          audioFiles: AUDIO_FILES,
          pcmData: PCM_DATA,
          startHorn: function() { return startHorn(); },
          stopHorn: function() { return stopHorn(); },
          strikeBell: function() { return strikeBell(); },
          getDiagnostics: function() { return { glitchMetrics: glitchMetrics, logCount: logHistory.length, logs: logHistory.slice(-25) }; },
          runOfflineVerification: runOfflineVerification
        };

        // --- Clipboard Diagnostics Copy Routine (Ladybug handler) ---
        function copyDiagnosticsToClipboard() {
          var header = '=== Big Walk Train Controls Diagnostic Report (Isolated Sub-Sample Engine) ===\n' +
            'Timestamp: ' + new Date().toISOString() + '\n' +
            'UserAgent: ' + navigator.userAgent + '\n' +
            'AudioContext: ' + (ctx ? ('State=' + ctx.state + ', currentTime=' + ctx.currentTime.toFixed(3) + ', sampleRate=' + ctx.sampleRate) : 'Not instantiated') + '\n' +
            'AudioSession: ' + (navigator.audioSession ? navigator.audioSession.type : 'unavailable') + ', isSecureContext: ' + window.isSecureContext + ', visibility: ' + document.visibilityState + '\n' +
            'isAudioUnlocked: ' + isAudioUnlocked + '\n' +
            'hornActive: ' + hornActive + '\n' +
            'bellStrikeCount: ' + bellStrikeCount + '\n' +
            'GlitchMetrics: ' + JSON.stringify(glitchMetrics) + '\n' +
            'Log Entries (' + logHistory.length + '):\n' +
            '----------------------------------------\n';

          var fullLogText = header + logHistory.join('\n') + '\n========================================';

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullLogText).then(function() {
              log('DIAG', 'Diagnostic logs copied to clipboard.');
            }).catch(function() {
              fallbackCopy(fullLogText);
            });
          } else {
            fallbackCopy(fullLogText);
          }
        }

        function fallbackCopy(text) {
          try {
            var textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            textArea.style.top = '0';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            log('DIAG', 'Diagnostic logs copied via fallback.');
          } catch (e) {
            log('DIAG-ERR', 'Clipboard copy failed: ' + e.message);
          }
        }

        function bindEvents() {
          var hBtn = document.getElementById('standalone-horn-btn');
          var bBtn = document.getElementById('standalone-bell-btn');
          var hDome = document.getElementById('standalone-horn-dome');
          var bDome = document.getElementById('standalone-bell-dome');
          var ladybugBtn = document.getElementById('ladybug-log-btn');
          var bellActive = false;

          if (ladybugBtn) {
            var onLadybugTap = function(e) {
              if (e) { e.preventDefault(); e.stopPropagation(); }
              ladybugBtn.style.transform = 'scale(0.85) rotate(-10deg)';
              setTimeout(function() {
                ladybugBtn.style.transform = 'scale(1) rotate(0deg)';
              }, 200);
              copyDiagnosticsToClipboard();
            };
            ladybugBtn.addEventListener('touchstart', onLadybugTap, { passive: false });
            ladybugBtn.addEventListener('click', onLadybugTap);
          }

          if (!hBtn || !bBtn) return;

          window.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
          }, { passive: false });

          document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
          }, { passive: false });

          document.addEventListener('selectstart', function(e) {
            e.preventDefault();
            return false;
          }, { passive: false });

          document.addEventListener('touchmove', function(e) {
            e.preventDefault();
          }, { passive: false });

          document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
          }, { passive: false });

          document.addEventListener('gesturechange', function(e) {
            e.preventDefault();
          }, { passive: false });

          document.addEventListener('gestureend', function(e) {
            e.preventDefault();
          }, { passive: false });

          document.addEventListener('touchstart', function() {
            getAudioCtx();
          }, { once: false, passive: true });

          function onHDown(e) {
            if (e) e.preventDefault();
            startHorn();
            if (hBtn) hBtn.style.transform = 'translateY(6px) scale(0.94)';
            if (hDome) hDome.style.background = 'linear-gradient(to bottom, #8f2723, #ab312c, #6e1e1a)';
            if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
          }

          function onHUp(e) {
            if (e) e.preventDefault();
            if (navigator.vibrate) { try { navigator.vibrate(0); } catch (err) {} }

          }

          function onBDown(e) {
            if (e) e.preventDefault();
            if (bellActive) return;
            bellActive = true;

            if (bBtn) bBtn.style.transform = 'translateY(6px) scale(0.94)';
            if (bDome) bDome.style.background = 'linear-gradient(to bottom, #a38029, #bf9832, #785b17)';
            if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
          }

          function onBUp(e) {
            if (e) e.preventDefault();
            if (navigator.vibrate) { try { navigator.vibrate(0); } catch (err) {} }
            if (!bellActive) return;
            bellActive = false;
            if (bBtn) bBtn.style.transform = 'none';
            if (bDome) bDome.style.background = 'linear-gradient(to bottom, #ffd766, #dfad32, #a87d1d)';
          }

          hBtn.addEventListener('touchstart', onHDown, { passive: false });
          hBtn.addEventListener('touchend', onHUp, { passive: false });
          hBtn.addEventListener('touchcancel', onHUp, { passive: false });

          bBtn.addEventListener('touchstart', onBDown, { passive: false });
          bBtn.addEventListener('touchend', onBUp, { passive: false });
          bBtn.addEventListener('touchcancel', onBUp, { passive: false });

          hBtn.addEventListener('pointerdown', function(e) { if (e.pointerType !== 'touch') onHDown(e); });
          hBtn.addEventListener('pointerup', function(e) { if (e.pointerType !== 'touch') onHUp(e); });
          hBtn.addEventListener('pointerleave', function(e) { if (e.pointerType !== 'touch') onHUp(e); });
          hBtn.addEventListener('pointercancel', function(e) { if (e.pointerType !== 'touch') onHUp(e); });

          bBtn.addEventListener('pointerdown', function(e) { if (e.pointerType !== 'touch') onBDown(e); });
          bBtn.addEventListener('pointerup', function(e) { if (e.pointerType !== 'touch') onBUp(e); });
          bBtn.addEventListener('pointerleave', function(e) { if (e.pointerType !== 'touch') onBUp(e); });
          bBtn.addEventListener('pointercancel', function(e) { if (e.pointerType !== 'touch') onBUp(e); });

          window.addEventListener('keydown', function(e) {
            if (e.repeat) return;
            var k = e.key.toLowerCase();
            if (k === 'arrowleft' || k === 'h' || k === 'z') onHDown(e);
            else if (k === 'arrowright' || k === 'b' || k === 'x') onBDown(e);
          });

          window.addEventListener('keyup', function(e) {
            var k = e.key.toLowerCase();
            if (k === 'arrowleft' || k === 'h' || k === 'z') onHUp(e);
            else if (k === 'arrowright' || k === 'b' || k === 'x') onBUp(e);
          });

          log('EVENTS', 'All control listeners bound successfully.');
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', bindEvents);
        } else {
          bindEvents();
        }
      })();
    </script>
    <script>
      // See top of file minimal-service-worker-rule
      if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./service-worker.js').catch(function(err) {
            console.error('Service Worker registration failed:', err);
          });
        });
      }
    </script>
